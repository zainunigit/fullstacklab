<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculator</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .calculator {
            width: 320px;
            background-color: #222;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

       
        .display {
            width: 100%;
            height: 70px;

            background-color: #333;
            color: white;

            border: none;
            border-radius: 10px;

            margin-bottom: 15px;
            padding: 15px;

            font-size: 30px;
            text-align: right;
        }

        
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        
        button {
            height: 60px;

            border: none;
            border-radius: 10px;

            font-size: 20px;
            cursor: pointer;

            background-color: #444;
            color: white;
        }

        button:hover {
            background-color: #f555;
        }

        
        .operator {
            background-color: #ff9500;
        }

        .operator:hover {
            background-color: #e08500;
        }

       
        .clear {
            background-color: #d9534f;
        }

        .clear:hover {
            background-color: #c9302c;
        }

       
        .equal {
            background-color: #28a745;
            grid-column: span 2;
        }

        .equal:hover {
            background-color: #218838;
        }

        
        .zero {
            grid-column: span 2;
        }
    </style>
</head>

<body>

    <div class="calculator">

       
        <div class="display">0</div>

       
        <div class="buttons">

            <button class="clear">C</button>
            <button>±</button>
            <button>%</button>
            <button class="operator">÷</button>

            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="operator">×</button>

            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="operator">−</button>

            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="operator">+</button>

            <button class="zero">0</button>
            <button>.</button>
            <button class="equal">=</button>

        </div>

    </div>

</body>
</html>
